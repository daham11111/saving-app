}

 if(tab=="p")body='<svg class="ring" width="220" height="220" viewBox="0 0 220 220"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient></defs><circle cx="110" cy="110" r="88" fill="none" stroke="var(--card2)" stroke-width="18"/><circle cx="110" cy="110" r="88" fill="none" stroke="'+(p>=100?"#22d39a":"url(#g)")+'" stroke-width="18" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'" transform="rotate(-90 110 110)"/><text x="110" y="112" text-anchor="middle" font-size="40" font-weight="800" fill="var(--tx)">'+p.toFixed(1)+'%</text><text x="110" y="140" text-anchor="middle" font-size="14" fill="var(--mut)">'+(i.bought?"Bought":p>=100?"Goal reached!":"In progress")+'</text></svg>'+
